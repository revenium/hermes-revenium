name: revenium-classifier
version: 1.0.0
description: Universal-coverage Hermes plugin that classifies every run_conversation() session end and writes a GUARDRAIL+CHAT marker pair for Revenium task-type attribution, and spools per-API-call metering events for event-driven completion metering. Covers gateway-served, CLI, interactive, ACP, and cron sessions.
hooks:
  - on_session_end
  - on_session_finalize
  - post_llm_call
  - post_api_request
