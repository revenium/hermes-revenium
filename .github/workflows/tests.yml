name: Tests

# The suite is stdlib unittest with no third-party dependencies, so this needs
# nothing but a Python and the checkout. It enforces the repo's invariants --
# file inventory, state-path discipline, shell syntax, marker and taxonomy
# schemas, split conservation, and the golden argv wire shapes -- which is why
# it runs on every PR rather than on a schedule.

on:
  pull_request:
    branches: ['**']
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    name: python3 -m unittest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so tests that compare against the base branch can
          # actually run. The default shallow checkout has no local `main`
          # ref, which made the Phase 61 boundary guard skip in CI -- turning
          # a real invariant (the compat fixtures, the shared test helper and
          # the event reporter are UNMODIFIED) into no coverage at all, where
          # a committed change to any of them would pass unchecked.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Show tool versions
        run: |
          python3 --version
          bash --version | head -1
          sqlite3 --version

      - name: Run the suite
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
